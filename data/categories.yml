# Categories shown in the README, in display order.
#
# `keywords` drive auto-categorisation of discovered apps. Each entry is a
# word or phrase matched on word boundaries against the repo's topics, name
# and description (topics count most). Prefix with "!" for a strong signal
# (counts double). Keep phrases specific — generic words like "privacy" or
# "open source" are deliberately absent because almost every FOSS app uses them.

- id: privacy
  title: Privacy & Security
  emoji: 🔒
  description: Firewalls, ad and tracker blockers, VPN/DNS clients, password managers and vaults.
  keywords: ["!firewall", "!block internet", "!internet access", "!adblock", "!ad blocker", "!tracker blocker", "!trackers", "!password manager", "!passwords", "!2fa", "!totp", "!otp", "!authenticator", "!vault", "!dns", "!doh", "vpn", "wireguard", "tor", "encryption", "encrypted", "keepass", "data breach", "secure", "security", "hide photos", "permission manager", "debloat", "degoogle", "microg"]

